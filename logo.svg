<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldBg" x1="60" y1="6" x2="60" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="shieldStroke" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="emblemGlow" x1="60" y1="28" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerCore" x1="36" y1="36" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="10" y="10" width="100" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="ambientLight" cx="60" cy="35" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Backlight -->
  <circle cx="60" cy="45" r="45" fill="url(#ambientLight)" />

  <!-- Outer Shield Shell -->
  <path d="M60 10C76 10 102 18 104 22C106 48 100 84 60 110C20 84 14 48 16 22C18 18 44 10 60 10Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldStroke)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Subtle Inset Shield -->
  <path d="M60 18C73 18 94 24 96 28C98 49 92 78 60 100C28 78 22 49 24 28C26 24 47 18 60 18Z" 
        stroke="#1E293B" 
        stroke-width="1.2" 
        stroke-dasharray="3 3" />

  <!-- Central Soulbound Emblem: Lock / Certificate Proof Core -->
  <g filter="url(#glow)">
    <!-- Padlock Shackle / Crest Arc -->
    <path d="M46 50V38C46 30.268 52.268 24 60 24C67.732 24 74 30.268 74 38V50" 
          stroke="url(#emblemGlow)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Solid Core Vault / Credential Plate -->
    <rect x="38" y="48" width="44" height="36" rx="8" 
          fill="#0B1120" 
          stroke="url(#innerCore)" 
          stroke-width="2.5" />

    <!-- Verification Proofline: Diagonal Ray & Checkmark -->
    <path d="M50 66L57 73L71 58" 
          stroke="#38BDF8" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Soulbound Binding Ring Node -->
    <circle cx="60" cy="94" r="3.5" fill="#38BDF8" />
    <line x1="60" y1="84" x2="60" y2="90.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
